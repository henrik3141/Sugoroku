<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壽出世双六 — Kotobuki Shusse Sugoroku</title>
<meta name="description" content="A playable version of the Edo-period life-course board game Kotobuki Shusse Sugoroku, for the G30 History course at Nagoya University.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <header class="masthead">
    <div>
      <div class="title-jp" id="title-jp">壽出世双六</div>
      <div class="title-en" data-i18n="title.sub"></div>
    </div>
    <div class="spacer"></div>
    <nav>
      <button class="btn btn-sm btn-ghost" id="nav-cells" data-i18n="nav.cells"></button>
      <button class="btn btn-sm btn-ghost" id="nav-odds" data-i18n="nav.odds"></button>
      <button class="btn btn-sm btn-ghost" id="nav-about" data-i18n="nav.about"></button>
      <span class="langbar">
        <label class="furi-toggle"><input type="checkbox" id="tgl-furi" checked>
          <span data-i18n="furigana.on"></span></label>
        <button class="btn btn-sm btn-lang" id="lang-btn"></button>
      </span>
    </nav>
  </header>

  <!-- ================= SETUP ================= -->
  <section class="screen active" id="screen-setup">
    <div class="setup-wrap">

      <div class="intro">
        <p class="lede" id="setup-lede"></p>

        <p data-i18n="setup.p2"></p>

        <p><span data-i18n="setup.p3"></span><br>
          <span data-i18n="setup.end.finish"></span> &nbsp;·&nbsp;
          <span data-i18n="setup.end.retire"></span> &nbsp;·&nbsp;
          <span data-i18n="setup.end.monk"></span></p>

        <div class="board-preview">
          <img src="assets/board.jpg" alt="The Kotobuki Shusse Sugoroku board">
        </div>

        <p class="print-credit" id="print-credit"></p>
      </div>

      <div class="setup-card">
        <h3 data-i18n="setup.players"></h3>
        <div class="count-row" id="count-row"></div>

        <div class="player-rows" id="player-rows"></div>

        <p class="assign-note" data-i18n="setup.assignNote"></p>

        <div class="setup-actions">
          <button class="btn" id="btn-reroll" data-i18n="setup.reroll"></button>
          <button class="btn btn-primary" id="btn-start" data-i18n="setup.start"></button>
        </div>
      </div>

    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section class="screen" id="screen-game">
    <div class="game-wrap">

      <div class="board-col">
        <div class="board-frame" id="board-frame">
          <img src="assets/board.jpg" alt="Kotobuki Shusse Sugoroku board print">
        </div>
        <div class="board-tools">
          <label><input type="checkbox" id="tgl-num" checked> <span data-i18n="board.showNums"></span></label>
          <span class="spacer" style="flex:1"></span>
          <span data-i18n="board.clickHint"></span>
        </div>
      </div>

      <div class="panel-col">

        <div class="card turn-card" id="turn-card">
          <div class="chance">
            <div id="wheel"></div>
            <div class="die" id="die"></div>
          </div>
          <div class="turn-info">
            <div class="whose" id="turn-whose"></div>
            <div class="at" id="turn-at"></div>
            <div class="msg" id="turn-msg"></div>
          </div>
          <div class="turn-actions">
            <button class="btn btn-primary" id="btn-roll"></button>
            <button class="btn btn-sm" id="btn-auto" data-i18n="btn.auto"></button>
            <button class="btn btn-sm btn-ghost" id="btn-quit" data-i18n="btn.quit"></button>
          </div>
          <div class="mode">
            <span class="mode-label" data-i18n="mode.label"></span>
            <span class="seg" id="mode-row">
              <button data-mode="wheel" data-i18n="mode.wheel"></button>
              <button data-mode="die" data-i18n="mode.die"></button>
            </span>
            <span class="mode-hint" id="mode-hint"></span>
          </div>
        </div>

        <div class="card">
          <div class="card-h"><span data-i18n="game.lifecourses"></span>
            <span class="spacer"></span><span id="turn-count"></span></div>
          <div class="plist" id="plist"></div>
        </div>

        <div class="card cellcard" id="cellcard"></div>

        <div class="card">
          <div class="card-h" data-i18n="game.record"></div>
          <div class="logbox" id="logbox"></div>
        </div>

      </div>
    </div>
  </section>

  <!-- ================= RESULTS ================= -->
  <section class="screen" id="screen-results">
    <div class="results">
      <h2 data-i18n="results.h"></h2>
      <p class="sub" data-i18n="results.sub"></p>
      <div id="res-list"></div>
      <div class="actions">
        <button class="btn btn-primary" id="btn-again" data-i18n="btn.again"></button>
        <button class="btn" id="btn-odds2" data-i18n="btn.odds2"></button>
      </div>
    </div>
  </section>

</div>

<footer class="sitefoot">
  <p class="credit" data-i18n="foot.credit"></p>
  <p id="foot-note"></p>
</footer>

<!-- ================= MODAL ================= -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="btn btn-sm close" id="modal-close" data-i18n="modal.close"></button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/boot.js"></script>
<script src="data/cells.js"></script>
<script src="data/characters.js"></script>
<script src="data/board.js"></script>
<script src="data/ui.js"></script>
<script src="js/i18n.js"></script>
<script src="js/wheel.js"></script>
<script src="js/game.js"></script>
</body>
</html>
